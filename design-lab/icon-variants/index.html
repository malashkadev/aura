<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura · варианты иконок</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --icon: #e6e6e6;
      --faint: #3a3a3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--icon);
      font-family: "Onest", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 128px);
      gap: 8px 40px;
      padding: 40px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 6px 0;
    }
    .big { display: flex; height: 56px; align-items: center; }
    .small { display: flex; height: 17px; align-items: center; color: #b9b9b9; }
    .num {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }
    svg { display: block; }
  </style>
</head>
<body>
  <div class="board" id="board"></div>

  <script>
    var BUBBLE =
      '<path d="M5 4.5h14A2.5 2.5 0 0 1 21.5 7v6.5a2.5 2.5 0 0 1-2.5 2.5h-8.3L7 20v-4H5a2.5 2.5 0 0 1-2.5-2.5V7A2.5 2.5 0 0 1 5 4.5z"/>';

    var VOICE = [
      // 1 — dots
      BUBBLE +
        '<circle cx="8.6" cy="10.3" r="1.05" fill="currentColor" stroke="none"/>' +
        '<circle cx="12" cy="10.3" r="1.05" fill="currentColor" stroke="none"/>' +
        '<circle cx="15.4" cy="10.3" r="1.05" fill="currentColor" stroke="none"/>',
      // 2 — waveform
      BUBBLE +
        '<path d="M9 8.6v3.4M12 7.6v5.4M15 9.1v2.4"/>',
      // 3 — text lines
      BUBBLE +
        '<path d="M8 9.3h8M8 12.4h5.5"/>'
    ];

    var EDIT = [
      // 1 — pencil with ferrule line
      '<path d="M15.9 3.6a2 2 0 0 1 2.8 0l1.7 1.7a2 2 0 0 1 0 2.8L9.9 18.6 4.4 20l1.4-5.5L15.9 3.6z"/>' +
        '<path d="M13.6 5.9l4.5 4.5"/>',
      // 2 — sliders
      '<path d="M3.5 8.5h6.6M15.9 8.5h4.6M3.5 15.5h9.6M18.9 15.5h1.6"/>' +
        '<circle cx="13" cy="8.5" r="2.3"/>' +
        '<circle cx="16" cy="15.5" r="2.3"/>',
      // 3 — wand with sparkle
      '<path d="M4 20l8.2-8.2"/>' +
        '<path d="M17.2 3.4l1.25 2.85 2.85 1.25-2.85 1.25-1.25 2.85-1.25-2.85-2.85-1.25 2.85-1.25 1.25-2.85z"/>'
    ];

    function svg(body, size) {
      return (
        '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
        'aria-hidden="true" xmlns="http://www.w3.org/2000/svg">' + body + "</svg>"
      );
    }

    var board = document.getElementById("board");
    var html = "";
    var rows = [VOICE, EDIT];
    for (var r = 0; r < rows.length; r += 1) {
      for (var i = 0; i < rows[r].length; i += 1) {
        html +=
          '<div class="cell">' +
          '<span class="big">' + svg(rows[r][i], 56) + "</span>" +
          '<span class="small">' + svg(rows[r][i], 17) + "</span>" +
          '<span class="num">' + (i + 1) + "</span>" +
          "</div>";
      }
    }
    board.innerHTML = html;
  </script>
</body>
</html>
