<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Menu</title>
  <link rel="stylesheet" href="tray-menu.css?v=2.0.21" />
  <script src="icon-system.js?v=2.0.24"></script>
  <script type="module" src="tray-menu.js?v=2.0.24" defer></script>
</head>
<body>
  <div class="aura-tray-menu" id="tray-menu">

    <!-- View 1: Main Menu -->
    <div class="menu-view active" id="view-main">
      <!-- 1. Open Settings -->
      <div class="aura-menu-item" id="item-open-settings" role="button" tabindex="0">
        <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.64 5.64l2.12 2.12M16.24 16.24l2.12 2.12M5.64 18.36l2.12-2.12M16.24 7.76l2.12-2.12"/>
        </svg>
        <span class="menu-text" id="label-settings">Открыть настройки</span>
      </div>

      <div class="menu-separator"></div>

      <!-- 2. Recognition Mode Trigger -->
      <div class="aura-menu-item" id="item-recog-trigger" role="button" tabindex="0">
        <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="10" x2="4" y2="14"/>
          <line x1="8" y1="6" x2="8" y2="18"/>
          <line x1="12" y1="3" x2="12" y2="21"/>
          <line x1="16" y1="6" x2="16" y2="18"/>
          <line x1="20" y1="10" x2="20" y2="14"/>
        </svg>
        <span class="menu-text" id="label-recog">Способ распознавания</span>
        <svg class="recog-status-icon" id="recog-status-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 10h-1.26A6 6 0 107.5 15.5h10.5a4 4 0 000-8z"/>
          <circle cx="12" cy="13" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <svg class="menu-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </div>

      <!-- 2b. Language Trigger (with globe icon) -->
      <div class="aura-menu-item" id="item-lang-trigger" role="button" tabindex="0">
        <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <path d="M12 3a13.5 13.5 0 010 18M12 3a13.5 13.5 0 000 18"/>
        </svg>
        <span class="menu-text" id="label-lang">Язык распознавания</span>
        <span class="lang-status-badge" id="lang-status-badge">RU</span>
        <svg class="menu-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </div>

      <!-- 3. Gaming Mode (clean toggle without redundant text badge) -->
      <div class="aura-menu-item" id="item-gaming" role="button" tabindex="0">
        <svg class="menu-icon gaming-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 11h12a4 4 0 014 4v2a2 2 0 01-3.4 1.4L16 16H8l-2.6 2.4A2 2 0 012 17v-2a4 4 0 014-4z"/>
          <path d="M6 13v2M5 14h2"/>
          <circle cx="16.5" cy="13.5" r="0.75" fill="currentColor"/>
          <circle cx="18.5" cy="15" r="0.75" fill="currentColor"/>
        </svg>
        <span class="menu-text" id="label-gaming">Игровой режим</span>
        <div class="menu-toggle" id="toggle-gaming" aria-label="Игровой режим">
          <div class="menu-toggle-thumb"></div>
        </div>
      </div>

      <div class="menu-separator"></div>

      <!-- 4. Exit -->
      <div class="aura-menu-item" id="item-exit" role="button" tabindex="0">
        <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18.36 6.64A9 9 0 115.64 6.64"/>
          <line x1="12" y1="3" x2="12" y2="11"/>
        </svg>
        <span class="menu-text" id="label-exit">Выход</span>
      </div>
    </div>

    <!-- View 2: Recognition Submenu -->
    <div class="menu-view" id="view-recog">
      <div class="drilldown-header" id="btn-back-header" role="button" tabindex="0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
        <span id="label-recog-sub">Способ распознавания</span>
      </div>

      <div class="menu-separator"></div>

      <div class="submenu-item" id="sub-cloud" role="button" tabindex="0">
        <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 10h-1.26A6 6 0 107.5 15.5h10.5a4 4 0 000-8z"/>
          <circle cx="12" cy="13" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span class="menu-text" id="label-cloud">Облачный ИИ</span>
        <svg class="check-mark" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12l5 5L19 7" stroke-width="2.2"/>
        </svg>
      </div>

      <div class="submenu-item" id="sub-local" role="button" tabindex="0">
        <svg class="menu-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2"/>
          <line x1="12" y1="16" x2="12" y2="20"/>
          <line x1="8" y1="20" x2="16" y2="20"/>
        </svg>
        <span class="menu-text" id="label-local">Локальный ИИ</span>
        <svg class="check-mark" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12l5 5L19 7" stroke-width="2.2"/>
        </svg>
      </div>
    </div>

    <!-- View 3: Language Submenu -->
    <div class="menu-view" id="view-lang">
      <div class="drilldown-header" id="btn-back-lang-header" role="button" tabindex="0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
        <span id="label-lang-sub">Язык распознавания</span>
      </div>

      <div class="menu-separator"></div>

      <div class="lang-list-container" id="lang-list-container">
        <!-- Populated dynamically by tray-menu.js for 12 languages -->
      </div>
    </div>

  </div>
</body>
</html>
