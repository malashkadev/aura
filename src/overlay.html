<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 10px;
      user-select: none;
    }

    body.no-timer:not(.has-status) {
      padding-top: 31px;
    }

    @property --beam-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @property --edit-beam-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @property --beam-opacity {
      syntax: '<number>';
      initial-value: 0;
      inherits: false;
    }

    .overlay-card {
      width: 134px;
      height: 39px;
      position: relative;
      border-radius: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.2px solid rgba(255, 255, 255, 0.05);
      box-shadow: none;
      animation: spin-beam 1.2s linear infinite;
      overflow: hidden;
      transition: border-color 0.45s ease;
      background: linear-gradient(#090909, #090909) padding-box,
                  conic-gradient(
                    from var(--beam-angle, 0deg),
                    transparent 0deg,
                    transparent 110deg,
                    rgba(254, 66, 0, var(--beam-opacity, 0)) 160deg,
                    transparent 180deg,
                    transparent 290deg,
                    rgba(254, 66, 0, var(--beam-opacity, 0)) 340deg,
                    transparent 360deg
                  ) border-box;
    }

    .overlay-card::before {
      content: "";
      position: absolute;
      inset: -32px;
      background: conic-gradient(
        from var(--edit-beam-angle, 0deg),
        transparent 0deg,
        rgba(254, 66, 0, 0.6) 80deg,
        rgba(255, 120, 50, 0.85) 100deg,
        rgba(254, 66, 0, 0.4) 140deg,
        transparent 200deg,
        transparent 360deg
      );
      animation: spin-edit-beam 2.5s linear infinite;
      filter: blur(14px);
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .overlay-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      background: rgba(9, 9, 9, 0.68);
      border-radius: 11.5px;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .overlay-card.edit-context {
      border-color: transparent;
    }

    .overlay-card.edit-context::before,
    .overlay-card.edit-context::after {
      opacity: 1;
      transition: opacity 0.25s ease-out;
    }

    .overlay-card.square::before,
    .overlay-card.square::after {
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    .overlay-card.processing {
      animation: spin-beam 1.1s linear infinite;
    }

    .overlay-card.square {
      border: 1.2px solid transparent;
      background: #090909;
      animation: none;
    }

    @keyframes spin-beam {
      to {
        --beam-angle: 360deg;
      }
    }

    @keyframes spin-edit-beam {
      to {
        --edit-beam-angle: 360deg;
      }
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
      border-radius: 11.3px;
      position: relative;
      z-index: 5;
    }

    #bars-group {
      transition: opacity 0.22s ease;
    }

    #overlay-status {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 9px;
      line-height: 11px;
      color: #e8e8e8;
      background: rgba(9, 9, 9, 0.66);
      border-radius: 6px;
      padding: 2px 7px;
      text-align: center;
      max-width: 150px;
      word-wrap: break-word;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #overlay-status.error {
      color: #ff5c5c;
      font-weight: 600;
    }

    .overlay-card.square ~ #overlay-status {
      opacity: 0;
      transform: translateX(-50%) translateY(4px);
    }


    html, body {
      background: transparent !important;
    }

    .overlay-pill {
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .overlay-pill.visible {
      opacity: 1;
      transform: scale(1);
    }

    @media (prefers-reduced-motion: reduce) {
      .overlay-pill {
        transition: none;
      }
      .overlay-card,
      .overlay-card::before {
        animation: none;
      }
    }
  </style>
</head>
<body>

          <rect class="sound-bar" x="45.0" y="11.6001" width="3" height="6" rx="1.5" fill="#FE4200"/>

          <rect class="sound-bar" x="70.2" y="11.6001" width="3" height="6" rx="1.5" fill="#FE4200"/>

          <rect class="sound-bar" x="82.8" y="11.6001" width="3" height="6" rx="1.5" fill="#FE4200"/>
          <rect class="sound-bar" x="89.1" y="11.6001" width="3" height="6" rx="1.5" fill="#FE4200"/>
        </g>
        <defs>
          <clipPath id="clip0_63_427">
            <rect width="19.2" height="19.2" fill="white" transform="matrix(-1 0 0 1 27.2 5)"/>
          </clipPath>
        </defs>
      </svg>
    </div>
    <div id="overlay-status">
      <span id="overlay-status-text"></span>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
