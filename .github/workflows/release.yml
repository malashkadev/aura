name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches the app version
        # A tag that disagrees with the version baked into the binary produces
        # an installer whose name, updater manifest and release title diverge.
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Verify workspace is clean
        # Release builds must run on exactly the committed tree; a dirty
        # checkout means the published installer was never verified as-is.
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if (git ls-files --others --exclude-standard | Select-String .) { throw "Untracked files present" }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Set up Go for OSV-Scanner
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.2"
          cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Run frontend static audit suite
        run: npm run audit

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Verify release surfaces match the manifest
        run: npm run verify:manifest

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Install and run cargo-audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2024-0429

      - name: Install and run osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          & "$(go env GOPATH)/bin/osv-scanner.exe" scan source --config=osv-scanner.toml -r .

  build:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Load release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notesFile = "RELEASE_NOTES_$version.md"
          if (Test-Path $notesFile) {
            $notes = Get-Content $notesFile -Raw
            $delimiter = [System.Guid]::NewGuid().ToString("N")
            "body<<$delimiter`n$notes`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw "Release notes file $notesFile not found"
          }

      - name: Build, sign, and publish Tauri artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aura v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          updaterJsonPreferNsis: true
          # Publish only after the artifact hash is copied into the manifest,
          # website and winget and the E2E checklist has passed.
          releaseDraft: true
          prerelease: false

      - name: Record and display built artifact SHA-256 and size
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*$version*.exe" | Select-Object -First 1
          if ($artifact) {
            $hash = (Get-FileHash -Path $artifact.FullName -Algorithm SHA256).Hash.ToUpper()
            $bytes = $artifact.Length
            Write-Host "=========================================="
            Write-Host "Release Artifact: $($artifact.Name)"
            Write-Host "File Size:        $bytes bytes"
            Write-Host "SHA-256 Checksum: $hash"
            Write-Host "=========================================="
            "### Release Artifact Info" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- **File:** ``$($artifact.Name)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- **SHA-256:** ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- **Size:** $bytes bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            throw "NSIS installer artifact not found after build"
          }
