name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches the app version
        # A tag that disagrees with the version baked into the binary produces
        # an installer whose name, updater manifest and release title diverge.
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Run frontend static audit suite
        run: npm run audit

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Verify release surfaces match the manifest
        run: npm run verify:manifest

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.96.0

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Verify workspace is clean
        # Release builds must run on exactly the committed tree, and no test or
        # audit step may leave untracked/modified files behind.
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if (git ls-files --others --exclude-standard | Select-String .) { throw "Untracked files present" }

      - name: Install and run cargo-audit
        shell: pwsh
        run: |
          $tempRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $zipPath = Join-Path $tempRoot "cargo-audit-v0.22.2.zip"
          $extractDir = Join-Path $tempRoot "cargo-audit-v0.22.2"
          Invoke-WebRequest -Uri "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-pc-windows-msvc-v0.22.2.zip" -OutFile $zipPath
          $actualSha = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToUpper()
          if ($actualSha -ne "0A7316540862C13D954F648917CEACCA593747BAED6EEC180FAFA590BE2710AB") {
            throw "cargo-audit SHA-256 mismatch: $actualSha"
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          New-Item -ItemType Directory -Path $cargoBin -Force | Out-Null
          Copy-Item -Path (Join-Path $extractDir "cargo-audit-x86_64-pc-windows-msvc-v0.22.2\cargo-audit.exe") -Destination (Join-Path $cargoBin "cargo-audit.exe") -Force
          # RUSTSEC-2024-0429: unsound warning on `glib 0.18.5`, pulled into Cargo.lock
          # via Tauri v2's Linux-only `wry`/`webkit2gtk`/`gtk` target dependencies (never compiled on Windows).
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429

      - name: Install and run osv-scanner
        shell: pwsh
        run: |
          $tempRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $osvExe = Join-Path $tempRoot "osv-scanner-v2.3.8.exe"
          Invoke-WebRequest -Uri "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_windows_amd64.exe" -OutFile $osvExe
          $actualSha = (Get-FileHash -Path $osvExe -Algorithm SHA256).Hash.ToUpper()
          if ($actualSha -ne "CB04E79DD9698A7BC821BBFDDDEC916A416D1409FDA79C927C509D37D00C9716") {
            throw "osv-scanner SHA-256 mismatch: $actualSha"
          }
          & $osvExe scan source --config=osv-scanner.toml -r .

  build:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Load release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notesFile = "RELEASE_NOTES_$version.md"
          if (Test-Path $notesFile) {
            $notes = Get-Content $notesFile -Raw
            $delimiter = [System.Guid]::NewGuid().ToString("N")
            "body<<$delimiter`n$notes`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw "Release notes file $notesFile not found"
          }

      - name: Build, sign, and publish Tauri artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aura v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          updaterJsonPreferNsis: true
          # Publish only after the artifact hash is copied into the manifest,
          # website and winget and the E2E checklist has passed.
          releaseDraft: true
          prerelease: false

      - name: Record and display built artifact SHA-256 and size
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*$version*.exe" | Select-Object -First 1
          if ($artifact) {
            $hash = (Get-FileHash -Path $artifact.FullName -Algorithm SHA256).Hash.ToUpper()
            $bytes = $artifact.Length
            Write-Host "=========================================="
            Write-Host "Release Artifact: $($artifact.Name)"
            Write-Host "File Size:        $bytes bytes"
            Write-Host "SHA-256 Checksum: $hash"
            Write-Host "=========================================="
            "### Release Artifact Info" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- **File:** ``$($artifact.Name)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- **SHA-256:** ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- **Size:** $bytes bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            throw "NSIS installer artifact not found after build"
          }
