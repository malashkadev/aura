ShortDescription: Быстрый приватный голосовой ввод для Windows на базе Whisper и NVIDIA Parakeet (CPU и CUDA).
Description: |-
  Aura — программа глобального голосового ввода для Windows. Переводит речь в текст и вставляет в любое активное окно.
  Поддерживает локальные резидентные движки Whisper.cpp и NVIDIA Parakeet (CPU и CUDA), потоковый ввод в реальном времени,
  автоопределение полноэкранных 3D-игр (Игровой режим), выгрузку моделей из VRAM при бездействии и автозамену текста.
